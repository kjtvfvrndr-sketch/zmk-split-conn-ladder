# Фрагмент для config/boards/shields/k04_micro/k04_micro_left.conf
# (ПЕРИФЕРИЙНАЯ половина). Одна необязательная строка.
#
# Левая раз в секунду смотрит на свой детектор VBUS (он есть в nRF52840 и
# работает без USB-стека, которого у периферийной половины нет) и сообщает
# правой, есть ли у неё питание от USB. Когда на кабеле обе половины,
# лестница стоит на ACTIVE: экономить нечего. Без этой строки правая считает
# левую на батарее — на кабеле работают кабельные ступени, и вся разница в
# синхронизации диодов (до 450–750 мс), пока заряжаются обе.
#
# Модуль в сборке левой уже есть: west подключает все модули из манифеста к
# обеим половинам, добавлять ничего не нужно.
#
# Лог левой: «USB power present at boot», потом «USB power present|absent».
# Лог правой: «other half reports USB power present|absent» на каждое
# соединение, «other half: USB power ...» при изменениях.
CONFIG_ZMK_SPLIT_CONN_LADDER_PERIPHERAL_POWER=y
