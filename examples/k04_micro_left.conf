# Фрагмент для config/boards/shields/k04_micro/k04_micro_left.conf
# (ПЕРИФЕРИЙНАЯ половина). Добавлять ничего не нужно: west подключает все
# модули из манифеста к обеим половинам, и у левой по умолчанию включены все
# три её части.
#
# 1. Отчёт о питании (ZMK_SPLIT_CONN_LADDER_PERIPHERAL_USB_POWER_REPORT).
#    Левая раз в секунду смотрит на свой детектор VBUS (он есть в nRF52840 и
#    работает с USB-стеком и без него) и сообщает правой, есть ли у неё
#    питание от USB. Левая на USB — у ACTIVE латентность 0 (ей нечего
#    экономить); обе на USB — лестница стоит на ACTIVE. В отчёте ещё и её
#    аптайм: по нему правая отличает сон левой от потери связи.
#    Лог левой (модуль zmk_split_conn_ladder_usb_power_report):
#    «USB power present at boot», потом «USB power present|absent».
#    Лог правой: «other half reports USB power present|absent» на каждое
#    соединение, «other half: USB power ...» при изменениях.
#
# 2. Ранний сон (ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP). Без правой левая засыпает
#    через ~60 с после своей последней клавиши (30 с до IDLE и ещё
#    ABSENCE_WAIT_MS, авто 30 с) — на любом питании, в том числе на зарядке:
#    без правой ей нечего делать, и диод не мигает впустую. Будит клавиша или
#    подключение кабеля. В сборке с USB-логом (ZMK_USB_LOGGING) ранний сон по
#    умолчанию выключен, чтобы лог не обрывался; =y включает его и там.
#    Лог левой (модуль zmk_split_conn_ladder_early_sleep):
#    «early sleep after 30 s of idle without the central half», перед сном
#    «early sleep in 100 ms: no central half, idle for 30 s».
#
# 3. Закрытие связи перед сном (ZMK_SPLIT_CONN_LADDER_PERIPHERAL_CLOSE_LINK_BEFORE_SLEEP).
#    Сон ZMK выключает левую молча, и правая узнаёт об этом только по таймауту
#    связи. До тех пор цвет слоя, который правая шлёт на диод левой, копится
#    в буферах Bluetooth, общих с отчётами компьютеру, и трекбол тормозит.
#    С этой частью левая перед сном закрывает связь, правая видит это сразу
#    (причина 0x13) и не считает это отказом шага.
#    Подтверждение — в логе правой: «split link closed by the other half at
#    step N (reason 0x13: on purpose, as before its sleep) -- not a step
#    failure». Строку левой («going to sleep: link to the central closed in
#    N ms») USB-лог не покажет: сон ZMK бывает только без USB-питания.
#
# Выключить по отдельности:
# CONFIG_ZMK_SPLIT_CONN_LADDER_PERIPHERAL_USB_POWER_REPORT=n
# CONFIG_ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP=n
# CONFIG_ZMK_SPLIT_CONN_LADDER_PERIPHERAL_CLOSE_LINK_BEFORE_SLEEP=n
