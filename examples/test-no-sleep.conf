# ПРОГОН БЕЗ СНА — самый чистый диагностический тест из доступных.
#
# Отключённый сон убирает единственный конфаунд, испортивший прошлые логи:
# левая половина не может уснуть сама. Значит любой `split link lost` в этом
# прогоне — точно лестница, а не её собственный deep sleep.
#
# Временно. После теста вернуть ZMK_SLEEP=y.
#
# Правая на кабеле в режиме AUTO идёт по кабельным ступеням, а не по
# батарейным. Прогон батарейных — либо на батарее (глубину потом видно по
# строке «step K/N on cable ... switch from level K» после того, как снова
# воткнуть кабель), либо с кабелем и логом, но тогда сначала нажать
# &ladder LADDER_TOG (режим ON).

# --- в config/k04_micro.conf ---
# ZMK_IDLE_SLEEP_TIMEOUT объявлен внутри `if ZMK_SLEEP`, поэтому на время
# прогона строку с ним лучше закомментировать. Сборку она не сломает, но
# каждая сборка будет писать предупреждение вида
#   ZMK_IDLE_SLEEP_TIMEOUT ... was assigned the value '3600000' but got the
#   value ''. Check these unsatisfied dependencies: ZMK_SLEEP (=n).
# Вернуть вместе с ZMK_SLEEP=y.
#
# # CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=n

# --- в config/boards/shields/k04_micro/k04_micro_right.conf ---
# (поверх обычного блока лестницы)
#
# Ступень 4 — предсонная, через 30 мин. 400 мс / lat 0.
# присутствие 400 мс, разгон 3.2 с, окон 20, central 29 мкА.
# Разгон намеренно выходит за бюджет 1.5 с: эта ступень существует, чтобы
# сон был не нужен часами, и судить её надо по возврату, а не по батарее.
#
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEPS=4
# CONFIG_ZMK_SPLIT_CONN_LADDER_S4_AFTER_MS=1800000
# CONFIG_ZMK_SPLIT_CONN_LADDER_S4_INT=319
# CONFIG_ZMK_SPLIT_CONN_LADDER_S4_LATENCY=0
# CONFIG_ZMK_SPLIT_CONN_LADDER_S4_TIMEOUT=800

# Чтобы увидеть всю лестницу за четыре минуты, а не за полчаса,
# на первый прогон можно сжать расписание и потом вернуть:
#
# CONFIG_ZMK_SPLIT_CONN_LADDER_S1_AFTER_MS=60000
# CONFIG_ZMK_SPLIT_CONN_LADDER_S2_AFTER_MS=120000
# CONFIG_ZMK_SPLIT_CONN_LADDER_S3_AFTER_MS=180000
# CONFIG_ZMK_SPLIT_CONN_LADDER_S4_AFTER_MS=240000
