# ПРОГОН БЕЗ СНА — самый чистый диагностический тест из доступных.
#
# Без сна ни одна половина не может уснуть сама — ни сном ZMK, ни ранним сном
# модуля. Значит любой `split link lost` в этом прогоне — точно лестница, а не
# чей-то deep sleep. Выключать надо оба: ранний сон уложит левую без правой и
# правую без компьютера, даже когда сон ZMK выключен.
#
# Временно. После теста вернуть ZMK_SLEEP=y и убрать строки EARLY_SLEEP=n.
#
# Правая на питании от USB в режиме AUTO идёт по ступеням для USB, а не по
# батарейным. Прогон батарейных — либо на батарее (глубину потом видно по
# строке «step K/N on USB power: ... switch from level K ...» после того,
# как снова воткнуть кабель), либо с кабелем и логом, но тогда сначала нажать
# &ladder LADDER_TOG (режим ON).

# --- в config/k04_micro.conf (обе половины) ---
# ZMK_IDLE_SLEEP_TIMEOUT объявлен внутри `if ZMK_SLEEP`, поэтому на время
# прогона строку с ним лучше закомментировать. Сборку она не сломает, но
# каждая сборка будет писать предупреждение вида
#   ZMK_IDLE_SLEEP_TIMEOUT ... was assigned the value '3600000' but got the
#   value ''. Check these unsatisfied dependencies: ZMK_SLEEP (=n).
# Вернуть вместе с ZMK_SLEEP=y.
#
# # CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP=n

# --- в config/boards/shields/k04_micro/k04_micro_right.conf ---
# (поверх CONFIG_ZMK_SPLIT_CONN_LADDER=y)
#
# Чтобы увидеть всю лестницу за четыре минуты, а не за двадцать, на первый
# прогон можно сжать расписание и потом вернуть (ступень 1 и так сразу):
#
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP2_AFTER_IDLE_MS=60000
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP3_AFTER_IDLE_MS=120000
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP4_AFTER_IDLE_MS=180000
