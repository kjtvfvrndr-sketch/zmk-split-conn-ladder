# Фрагмент для общего config/k04_micro.conf (обе половины).
#
# ВНИМАНИЕ: если CONFIG_ZMK_IDLE_SLEEP_TIMEOUT в файле уже есть — ПРАВИТЬ ту
# строку. Kconfig на повторное присваивание не ругается, просто берёт
# последнее, и результат зависит от порядка вставки.

# Левая половина сбрасывает свой таймер сна ТОЛЬКО собственными клавишами:
# сплит-трафик и цвет слоя, присланный с центральной, за активность не
# считаются (проверено: split/peripheral.c вызывает поведение напрямую, без
# zmk_position_state_changed). Час убирает её засыпание посреди работы, а на
# ступени лестницы это стоит десятки мкА*ч.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
