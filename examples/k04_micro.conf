# Фрагмент для общего config/k04_micro.conf (обе половины).
#
# ВНИМАНИЕ: если CONFIG_ZMK_IDLE_SLEEP_TIMEOUT в файле уже есть — ПРАВИТЬ ту
# строку. Kconfig на повторное присваивание не ругается, просто берёт
# последнее, и результат зависит от порядка вставки.

# Собственный сон ZMK — страховка на батарее. Без компьютера (правая) и без
# правой (левая) половины засыпают раньше, ранним сном модуля, примерно через
# минуту после последней клавиши. С компьютером ждёт ступень 4 лестницы: через
# 20 мин простоя, ~59 мкА на правой и ~31 мкА на левой по модели, возврат
# ~3.2 с вместо перезагрузки и переподключения (README, «Step 4 instead of
# sleep»). Час оставляет ей место; короче 20.5 мин — и на батарее она не
# наступит. На кабеле ZMK не спит вообще.
#
# Левая сбрасывает свой таймер сна ТОЛЬКО собственными клавишами: сплит-трафик
# и цвет слоя, присланный с центральной, за активность не считаются. После часа
# одного трекбола левая уснёт сама — правая тогда ищет её экономным поиском
# (LOW_POWER_PERIPHERAL_SEARCH), и первая клавиша на левой будит её за
# секунду-другую.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
