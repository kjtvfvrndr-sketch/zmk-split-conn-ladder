# Фрагмент для config/boards/shields/k04_micro/k04_micro_right.conf
# (центральная половина — только она держит роль central на сплит-линке).
#
# ВНИМАНИЕ 1: Kconfig .conf не понимает комментарии в конце строки присваивания.
# Всё после '=' до конца строки — значение. Комментарии только отдельными строками.
#
# ВНИМАНИЕ 2: повторное присваивание символа — не ошибка. Kconfig молча берёт
# ПОСЛЕДНЕЕ и ничего не пишет в лог. Если символ в файле уже есть — ПРАВИТЬ ту
# строку, а не дописывать вторую.

# ── Лестница простоя, экономный поиск левой, ранний сон ──
# Одна строка. Всё остальное — умолчания модуля:
#   - ступени считаются сами (COMPUTED_STEPS) и пересчитываются, когда
#     меняется связь с компьютером, вывод (USB/BLE) или питание левой;
#   - правая ищет пропавшую левую 35 с (ABSENCE_WAIT_MS): пока ввод идёт на
#     BLE-хост — средним поиском (30 мс раз в 240 мс), иначе полным поиском
#     ZMK; дальше слушает сама 30 мс раз в 1.28 с (~0.1 мА вместо ~2.5 мА) —
#     экономный поиск. Пока ввод идёт на USB-хост — всегда полный поиск;
#   - без компьютера (ни BLE-хоста на активном профиле, ни USB-хоста,
#     настроившего клавиатуру) правая засыпает через ~65 с после последней
#     клавиши — на любом питании, в том числе на зарядке или пауэрбанке.
CONFIG_ZMK_SPLIT_CONN_LADDER=y

# CONFIG_ZMK_SPLIT_BLE_PREF_* не задавать: линк создаётся на умолчаниях ZMK
# (6/30/400) и через пару секунд уходит на вычисленный ACTIVE; другие
# значения сборка отметит предупреждением.
#
# Что получится с трекболом (ZMK_POINTING) и цветом слоя на левой
# (RGBLED_WIDGET_LAYER_PUSH — от него синхронизация диодов ~163 мс):
#
#            после IDLE  Mac (хост 15 мс)     PC (7.5 мс) / без хоста   возврат
#   ACTIVE       —       12.5 мс / lat 12     16.25 мс / lat 9          —
#   ступень 1    0 мин   31.25 мс / lat 13    так же                    1.47 с
#   ступень 2    3 мин   83.75 мс / lat 3     так же                    1.42 с
#   ступень 3   10 мин  136.25 мс / lat 1     так же                    1.50 с
#   ступень 4   20 мин  398.75 мс / lat 0     так же                    3.19 с
#
# Левая на связи раз в 163 мс на ACTIVE, 438 / 335 / 273 / 399 мс на
# ступенях. Правая по модели: ~900 (Mac) / ~700 мкА на ACTIVE, ~380, 160, 110
# и 59 мкА на ступенях; левая ~58 мкА на ACTIVE, 29–40 мкА на ступенях.
# Вывод на USB: ACTIVE 8.75 мс / lat 18. Левая на USB: латентность ACTIVE 0.
#
# На питании от USB (режим AUTO) ступени те же и на тех же таймерах, но
# интервал остаётся как у ACTIVE — клавиши левой не ждут, — растёт только
# латентность, до синхронизации 625 мс на ступени 4:
#   Mac: lat 21 / 30 / 39 / 49 (275 / 388 / 500 / 625 мс)
#   PC или без хоста: 16 / 23 / 30 / 37 (276 / 390 / 504 / 618 мс)
# Обе половины на USB — лестница стоит на ACTIVE.
#
# В логе при старте и при каждом пересчёте: «steps computed ...» и вся
# таблица под ней.

# ── Умолчания, для справки (раскомментировать, чтобы изменить) ──
# Число ступеней (1–6) и бюджеты возврата: всех ступеней, кроме последней,
# и последней. DEEPEST_STEP_RETURN_BUDGET_MS=0 — у последней общий бюджет
# 1.5 с: ступень 4 станет 186.25 мс / lat 0.
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP_COUNT=4
# CONFIG_ZMK_SPLIT_CONN_LADDER_RETURN_BUDGET_MS=1500
# CONFIG_ZMK_SPLIT_CONN_LADDER_DEEPEST_STEP_RETURN_BUDGET_MS=3200
#
# Таймеры ступеней от входа в IDLE (IDLE — через 30 с после последней клавиши).
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP1_AFTER_IDLE_MS=0
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP2_AFTER_IDLE_MS=180000
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP3_AFTER_IDLE_MS=600000
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP4_AFTER_IDLE_MS=1200000
#
# ABSENCE_WAIT_MS — сколько половина обходится без того, что ей нужно, прежде
# чем экономить: до раннего сна (от входа в IDLE без компьютера) и до
# экономного поиска (от потери левой). 0 — авто: 35 с, не меньше формулы
# записи настроек. Число одно намеренно: левая, потеряв правую, ждёт своё
# ABSENCE_WAIT_MS и засыпает — полный (или средний) поиск идёт, пока она ещё
# не спит.
# EARLY_SLEEP_BLE_PAIRING_WAIT_MS — ожидание сна, пока активный BLE-профиль
# ждёт сопряжения с компьютером.
# CONFIG_ZMK_SPLIT_CONN_LADDER_ABSENCE_WAIT_MS=0
# CONFIG_ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP_BLE_PAIRING_WAIT_MS=180000
#
# Засыпать и без левой, даже с компьютером (кроме случая «на USB и с
# компьютером»). По умолчанию выключено: правая с трекболом полезна и одна.
# CONFIG_ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP_WITHOUT_PERIPHERAL=y
#
# Выключить по отдельности:
# CONFIG_ZMK_SPLIT_CONN_LADDER_EARLY_SLEEP=n
# CONFIG_ZMK_SPLIT_CONN_LADDER_LOW_POWER_PERIPHERAL_SEARCH=n
#
# Средний поиск левой: пока ввод идёт на BLE-хост, первые ABSENCE_WAIT_MS
# правая слушает 30 мс раз в столько мс вместо полного поиска ZMK (30 мс раз в
# 60 мс), и трекбол почти не тормозит. 0 — полный поиск ZMK, как без хоста.
# CONFIG_ZMK_SPLIT_CONN_LADDER_MIDDLE_PERIPHERAL_SEARCH_INTERVAL_MS=240
#
# Задать ступень вручную (остальное считается вокруг неё), например
# латентность ступени 1: интервал для неё посчитается сам. Сборка проверяет
# заданное: ступень, которая не возвращается в свой бюджет, её остановит.
# Подробно — README, «Setting steps by hand».
# CONFIG_ZMK_SPLIT_CONN_LADDER_STEP1_LATENCY=11

# ── Трекбол: RUN на кабеле только при живом хосте ──
# CONFIG_PMW3610_ALT_FORCE_AWAKE_ON_USB_POWER=y держит сенсор в RUN на USB.
# С патчем драйвера — только пока есть хост (USB, настроивший клавиатуру, или
# BLE на активном профиле): на зарядке без хоста сенсор уходит в свои REST, и
# ранний сон не уносит RUN (0.6 мА) в System OFF. Отдельной строки здесь для
# этого не нужно.

# ── Клавиша, разбудившая компьютер по USB ──
# ZMK выбрасывает отчёт, пока шина USB спит (usb_hid.c просит пробуждения
# и возвращается — в логе это «FAILED TO SEND OVER USB: -11»), а потом, пока
# Mac просыпается и ещё не читает клавиатуру, может оставить у него «зажатую»
# клавишу. Опция после пробуждения повторяет текущее состояние клавиатуры,
# пока хост не начнёт читать: всё ещё нажатая клавиша печатается один раз,
# залипших не остаётся. С лестницей не связана; без этой строки ничего из неё
# в прошивку не попадает.
CONFIG_ZMK_USB_RESEND_KEYS_AFTER_WAKE=y
