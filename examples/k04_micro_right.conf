# Фрагмент для config/boards/shields/k04_micro/k04_micro_right.conf
# (центральная половина — только она держит роль central на сплит-линке).
#
# ВНИМАНИЕ 1: Kconfig .conf не понимает комментарии в конце строки присваивания.
# Всё после '=' до конца строки — значение. Комментарии только отдельными строками.
#
# ВНИМАНИЕ 2: повторное присваивание символа — не ошибка. Kconfig молча берёт
# ПОСЛЕДНЕЕ и ничего не пишет в лог. Если в файле уже есть, например,
# CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=10 — ПРАВИТЬ ту строку, а не дописывать
# вторую: иначе победитель зависит от порядка вставки.

# Стек задавать не нужно: лестница работает в собственной очереди и сама
# выбирает стек (1024, в сборке с логом 1536). Строка
# CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE, если она уже есть в файле, к
# лестнице больше отношения не имеет — это очередь ZMK для других функций.

# ── Сплит-линк, параметры ACTIVE ──
# С этими значениями линк создаётся в bt_conn_le_create(), и их же читает
# модуль как «ступень 0», так что разъехаться им нечем.
# INT в шагах 1.25 мс: 10 = 12.5 мс. Значение выбрано ОТНОСИТЕЛЬНО ссылки с
# компьютером: macOS держит свою на 15 мс, а правая половина ведёт обе на
# одном радио. При совпадении событий эфир достаётся тому, кто дольше ждал,
# поэтому сплит должен быть КОРОЧЕ хостового и НЕ кратен ему: 12.5 мс
# выигрывает Mac, и события к компьютеру не теряются. Кратные 7.5 и 15
# застревают в одной фазе на десятки секунд — это и было «желе» курсора.
# Подробности в README, раздел «The interval and the computer's own link».
CONFIG_ZMK_SPLIT_BLE_PREF_INT=10
# Задержка синхронизации диодов = 12.5 * (12+1) = 162.5 мс.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=12
# TIMEOUT в шагах 10 мс: 600 = 6 с.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# ── Лестница простоя ──
CONFIG_ZMK_SPLIT_CONN_LADDER=y
CONFIG_ZMK_SPLIT_CONN_LADDER_STEPS=3

# Режим при загрузке. y — AUTO (по умолчанию, строку можно не писать): на
# батарее ступени батареи, на кабеле — кабельные ступени (блок ниже), а если
# на кабеле и левая (она сообщает об этом строкой в k04_micro_left.conf) —
# ACTIVE. =n: грузиться сразу в ON (ступени батареи и на кабеле). Кнопка
# &ladder переключает режим на ходу, до перезагрузки.
CONFIG_ZMK_SPLIT_CONN_LADDER_PAUSE_ON_USB=y

# Интервал экономит центральную (сплит-линк — ~97% её радиобюджета при 12.5 мс,
# и латентностью она пользоваться не может). Латентность экономит периферию и
# задаёт время возврата: interval * (3*latency + 8). Ступени подобраны под
# бюджет разгона ~1.5 с, а не под минимум тока.
#
# Отсчёт after_ms идёт от входа в IDLE, то есть от ZMK_IDLE_TIMEOUT (30 с)
# после последней активности.

# Ступень 1 — через 1 мин после IDLE. 31.25 мс / lat 14.
# присутствие 469 мс, разгон 1.56 с, окон 17.1, central ~346 мкА.
# 25, а не 24: интервал не должен быть кратен хостовым 15 и 7.5 мс, иначе
# первые секунды после пробуждения (пока идёт возврат со ступени) события
# компьютера стоят под событиями сплита.
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_AFTER_MS=60000
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_INT=25
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_LATENCY=14
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_TIMEOUT=800

# Ступень 2 — через 2.5 мин. 61.25 мс / lat 5.
# присутствие 368 мс, разгон 1.41 с, окон 21.8, central ~177 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_AFTER_MS=150000
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_INT=49
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_LATENCY=5
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_TIMEOUT=800

# Ступень 3 — через 10 мин. 121.25 мс / lat 1.
# присутствие 243 мс, разгон 1.33 с, окон 33.0, central ~91 мкА.
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_AFTER_MS=600000
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_INT=97
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_LATENCY=1
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_TIMEOUT=800

# ── Те же ступени на кабеле (режим AUTO) ──
# Таймеры общие (S*_AFTER_MS выше), свои только параметры. Интервал остаётся
# как у ACTIVE: правой на кабеле экономить нечего, а клавиши левой уходят на
# ближайшем событии связи при любой латентности — нажатия не задерживаются,
# даже во время возврата. Латентность экономит левую; ждёт только то, что идёт
# К ней (синхронизация диодов): до 12.5 * (29+1) = 375 мс на S1/S2 и
# 12.5 * (49+1) = 625 мс на S3. Левая: ~58 мкА на ACTIVE (lat 12) -> ~32 мкА
# (lat 29) -> ~24 мкА (lat 49).
#
# Ниже значения по умолчанию. S*_USB_INT по умолчанию равен
# CONFIG_ZMK_SPLIT_BLE_PREF_INT и сам идёт за ним, поэтому его здесь нет.
# S2 совпадает с S1: на кабеле ступень 2 ничего не отправляет, в логе
# «step 2/3 on cable: parameters already in place».
# Вернуть прежнее «на кабеле стоять на ACTIVE»: символ
# CONFIG_ZMK_SPLIT_CONN_LADDER_USB_STEPS со значением n.
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_USB_LATENCY=29
CONFIG_ZMK_SPLIT_CONN_LADDER_S1_USB_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_USB_LATENCY=29
CONFIG_ZMK_SPLIT_CONN_LADDER_S2_USB_TIMEOUT=800
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_USB_LATENCY=49
CONFIG_ZMK_SPLIT_CONN_LADDER_S3_USB_TIMEOUT=800

# ── Клавиша, разбудившая компьютер по USB ──
# ZMK выбрасывает отчёт, пока шина USB спит (usb_hid.c просит пробуждения
# и возвращается — в логе это «FAILED TO SEND OVER USB: -11»), а потом, пока
# Mac просыпается и ещё не читает клавиатуру, может оставить у него «зажатую»
# клавишу. Опция после пробуждения повторяет текущее состояние клавиатуры,
# пока хост не начнёт читать: всё ещё нажатая клавиша печатается один раз,
# залипших не остаётся. С лестницей не связана и по умолчанию выключена:
# без этой строки ничего из неё в прошивку не попадает.
# CONFIG_ZMK_USB_RESUME_RESEND=y
